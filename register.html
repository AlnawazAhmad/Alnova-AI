```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | Alnova AI</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="auth-page">

        <div class="auth-box">

            <div class="auth-logo">
                🤖 Alnova AI
            </div>

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Join the world of Artificial Intelligence
            </p>


            <form id="registerForm">

                <label>Full Name</label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your full name"
                    required
                >


                <label>Email</label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
                >


                <label>Password</label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create password"
                    required
                >


                <label>Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    required
                >


                <button
                    type="submit"
                    class="auth-btn">

                    Create Account ✨

                </button>

            </form>


            <p class="auth-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


            <a
                href="index.html"
                class="back-home">

                ← Back to Home

            </a>

        </div>

    </div>


    <!-- Only one JavaScript file -->

    <script src="script.js"></script>

</body>

</html>
```
