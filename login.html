```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Alnova AI</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="auth-page">

        <div class="auth-box">

            <div class="auth-logo">
                🤖 Alnova AI
            </div>

            <h1>Welcome Back!</h1>

            <p class="auth-subtitle">
                Login to continue your AI journey
            </p>


            <!-- Login Form -->

            <form id="loginForm">

                <label>Email</label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >


                <label>Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit"
                        class="auth-btn">

                    Login 🚀

                </button>

            </form>


            <p class="auth-link">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>


            <a href="index.html"
               class="back-home">

                ← Back to Home

            </a>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
```
