<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Interview | Alnova AI</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🤖 Alnova AI
        </div>

        <a href="dashboard.html" class="back-btn">
            ← Dashboard
        </a>

    </nav>


    <section class="tool-page">

        <h1>🎤 AI Interview Practice</h1>

        <p>
            Practice interview questions with Alnova AI
        </p>


        <div class="tool-box">

            <input
                type="text"
                id="interviewRole"
                placeholder="Enter job role e.g. Java Developer"
            >

            <button onclick="startInterview()">
                Start Interview 🎤
            </button>


            <div id="interviewResult" class="result-box">

                <h2>Interview Question</h2>

                <p>
                    Enter a job role to start.
                </p>

            </div>

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
