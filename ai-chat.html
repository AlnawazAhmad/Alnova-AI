<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Chat | Alnova AI</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div class="logo">
            🤖 Alnova AI
        </div>

        <a href="dashboard.html" class="back-btn">
            ← Dashboard
        </a>

    </nav>


    <!-- AI Chat Section -->
    <div class="chat-page">

        <h1>🤖 Alnova AI Chat</h1>

        <p>
            Ask anything and learn with AI
        </p>


        <!-- Chat Box -->
        <div class="chat-box">

            <div id="chatMessages" class="chat-messages">

                <div class="ai-message">
                    🤖 Hello! I am Alnova AI. How can I help you?
                </div>

            </div>


            <!-- Input Area -->
            <div class="chat-input">

                <input
                    type="text"
                    id="userMessage"
                    placeholder="Ask something..."
                >

                <button onclick="sendMessage()">
                    Send 🚀
                </button>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
